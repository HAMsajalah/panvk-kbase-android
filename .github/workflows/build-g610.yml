name: build-g610
on:
  push:
    branches: [g610]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config python3-pip python3-mako python3-yaml python3-ply python3-packaging \
            python3-pycparser bison flex glslang-tools cmake ccache clang-18 llvm-18-dev libclang-18-dev \
            libclang-cpp18-dev libclc-18-dev libclc-18 libllvmspirvlib-18-dev llvm-spirv-18 \
            spirv-tools spirv-headers zlib1g-dev libexpat1-dev libdrm-dev libelf-dev \
            rustc cargo file binutils unzip zip
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          sudo pip3 install --break-system-packages --upgrade meson mako pyyaml
          command -v bindgen >/dev/null || cargo install bindgen-cli --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Fetch exact Mesa
        run: ./scripts/fetch-mesa.sh
      - name: Apply patches (g610-v10-csf)
        run: ./scripts/apply-patches.sh --profile g610-v10-csf
      - name: Build host tools and Android driver
        env:
          PANVK_JOBS: 4
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-android.sh --profile g610-v10-csf
      - name: Validate binary
        run: ./scripts/validate-binary.sh --abi android dist/android-g610-v10-csf/libvulkan_panfrost.so
      - name: Package
        run: ./scripts/package-android-adpkg.sh --profile g610-v10-csf --version v0.1.0-g610-test
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-g610
          path: |
            dist/android-g610-v10-csf/libvulkan_panfrost.so
            dist/*.adpkg.zip
